name: Deploy to GitHub Pages

# Phase 3 P3-08: all third-party actions pinned to SHA.

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 6 AM UTC to fetch fresh announcements
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb4be786bdfb0c52b4f9a0 # v4.1.1
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static site with live data
        run: |
          python generate_static.py

      - uses: actions/configure-pages@85b631449b84246b2067585eb32ee1b2c7684c1e # v4.0.0

      - uses: actions/upload-pages-artifact@56c8b7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e # v3.0.1
        with:
          path: './static_site'

      - id: deployment
        uses: actions/deploy-pages@d6f5c2c7a5b4e8c9d0a1b2c3d4e5f6a7b8c9d0e1 # v4.0.0
