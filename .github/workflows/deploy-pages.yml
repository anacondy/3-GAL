name: Deploy to GitHub Pages

# SHA pinning (Phase 3) rolled back to version tags. See build-release.yml
# header for how to look up real SHAs and pin later.

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 6 AM UTC to fetch fresh announcements
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static site with live data
        run: |
          python generate_static.py

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './static_site'

      - id: deployment
        uses: actions/deploy-pages@v4
