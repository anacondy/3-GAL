name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Phase 3 P3-08: all third-party actions pinned to SHA, not @v1/@v4.
# To update a pin, visit the action's GitHub releases page, copy the
# commit SHA for the version you want, and update below.

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10']
        include:
          - os: ubuntu-latest
            artifact_name: 3gal-linux
            asset_ext: ''
          - os: macos-latest
            artifact_name: 3gal-macos
            asset_ext: ''
          - os: windows-latest
            artifact_name: 3gal-windows
            asset_ext: '.exe'

    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb4be786bdfb0c52b4f9a0 # v4.1.1
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --add-data "templates:templates" --name ${{ matrix.artifact_name }} app.py

      - uses: actions/upload-artifact@b7b2886c7a86371a42cfd0e48a1ec6230c7f10d3 # v4.0.3
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.asset_ext }}

  release:
    needs: build-python
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb4be786bdfb0c52b4f9a0 # v4.1.1
      - uses: actions/download-artifact@6348268ac6567e94f4042763e74f18e15223bf5d # v4.1.1
        with:
          path: artifacts

      - uses: softprops/action-gh-release@dec0d2cbf5e635e9b303d6e9bfe36c1915fd0951 # v1
        with:
          files: |
            artifacts/3gal-linux/3gal-linux
            artifacts/3gal-macos/3gal-macos
            artifacts/3gal-windows/3gal-windows.exe
          body: |
            ## 3-GAL Release

            See [docs/FINAL_REPORT.md](https://github.com/anacondy/3-GAL/blob/main/docs/FINAL_REPORT.md) for what changed.
